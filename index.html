<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        /* Базовые стили и цвета вашего сайта */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff; /* Фон сайта (светлый) */
            color: #111111;            /* Основной цвет текста (темный) */
        }

        header {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Настройки логотипа в две строки */
        .minimal-svg-logo {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Большое расстояние между строками логотипа */
            width: fit-content;
            cursor: pointer;
        }

        .minimal-svg-logo svg {
            display: block;
            fill: currentColor; /* Логотип сам примет цвет текста вашего сайта */
        }

        /* Эффект ультратонкой ниточки */
        .minimal-svg-logo .thin-line {
            stroke: currentColor;
            stroke-width: 0.6px; /* Линия тонкая, как нить */
            fill: none;
        }

        /* Пример навигации сайта */
        nav a {
            color: currentColor;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 300;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* Основной контент страницы */
        main {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            font-weight: 200;
            font-size: 36px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <!-- БЛОК ТОНКОГО ЛОГОТИПА -->
        <div class="minimal-svg-logo">
            
            <!-- Первая строка логотипа -->
            <svg width="250" height="35" viewBox="0 0 250 35">
                <text x="0" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="100" letter-spacing="6">
                    ПЕРВАЯ СТРОКА
                </text>
                <!-- Декоративная линия-ниточка под первым словом -->
                <line x1="0" y1="34" x2="230" y2="34" class="thin-line" />
            </svg>

            <!-- Вторая строка логотипа -->
            <svg width="250" height="25" viewBox="0 0 250 25">
                <text x="2" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="100" letter-spacing="10">
                    ВТОРЯЯ СТРОКА
                </text>
            </svg>

        </div>

        <!-- Навигационное меню (можно удалить или заменить) -->
        <nav>
            <a href="#">Главная</a>
            <a href="#">Проекты</a>
            <a href="#">Контакты</a>
        </nav>
    </header>

    <main>
        <h1>Добро пожаловать на сайт</h1>
        <p>Основной контент вашей страницы будет располагаться здесь.</p>
    </main>

</body>
</html>
